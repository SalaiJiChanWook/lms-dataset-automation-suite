name: Build and Release Windows Application

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ttkbootstrap selenium webdriver-manager google-api-python-client google-auth python-dotenv

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile `
            --name="LMS-Data-Automation-${{ github.ref_name }}" `
            --hidden-import="webdriver_manager" `
            --hidden-import="googleapiclient" `
            main.py

      - name: Generate Release Notes & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}